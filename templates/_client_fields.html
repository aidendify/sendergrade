<label>Client name <input name="client_name" value="{{ vals.client_name }}" required maxlength="120"></label>
<label>Sending domain <input name="domain" value="{{ vals.domain }}" required placeholder="clientbrand.com"></label>
<label>DKIM selectors (comma-separated, optional)
  <input name="dkim_selectors" value="{{ vals.dkim_selectors }}" placeholder="e.g. s1, s2 or k1 — leave blank to auto-guess">
</label>
<label>Notes <textarea name="notes" rows="2">{{ vals.notes }}</textarea></label>
<label class="check-row"><input type="checkbox" name="active" {% if vals.active %}checked{% endif %}> Active (checked daily)</label>
